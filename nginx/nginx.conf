worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream backend_a {
    server backend_a:4000;
  }

  upstream backend_b {
    server backend_b:4000;
  }

  # Round-robin pool for routes with no room code (create room, list public lobbies,
  # daily solo modes, health) — any instance can answer these.
  upstream backend_pool {
    server backend_a:4000;
    server backend_b:4000;
  }

  # The Socket.IO handshake carries the room code as a query param (see
  # frontend/src/lib/socket.ts) — its first character is the owning instance's tag,
  # assigned at room-creation time (see backend/src/domain/value-objects/room-code.ts).
  map $arg_code $ws_upstream {
    default   backend_pool;
    ~^A       backend_a;
    ~^B       backend_b;
  }

  server {
    listen 80;

    location /socket.io/ {
      proxy_pass http://$ws_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Matches /rooms/<CODE> and /rooms/<CODE>/settings|start — routes to the instance
    # that owns the room. Deliberately does not match bare /rooms (create/list), which
    # falls through to the catch-all pool below.
    location ~ ^/rooms/(?<room_tag>[A-Z0-9]) {
      set $room_upstream backend_pool;
      if ($room_tag = A) { set $room_upstream backend_a; }
      if ($room_tag = B) { set $room_upstream backend_b; }
      proxy_pass http://$room_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://backend_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
