openapi: 3.0.3
info:
  title: termo.io API
  version: 0.1.0
  description: >
    REST surface of the competitive real-time multiplayer word game. The real-time
    WebSocket contract is specified separately in `asyncapi.yaml`.
servers:
  - url: /
tags:
  - name: health
    description: Liveness probes
  - name: rooms
    description: Room lifecycle (create, browse, settings, start)
  - name: daily
    description: Stateless single-player daily puzzles (Termo, Dueto, Quarteto)
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room in lobby state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List public lobbies (playerId redacted)
      responses:
        '200':
          description: Public lobbies currently accepting players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicRoomSummary'
  /rooms/{code}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Fetch a room by code
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      responses:
        '200':
          description: Room record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{code}/settings:
    patch:
      tags: [rooms]
      operationId: updateRoomSettings
      summary: Update lobby settings (host only)
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomSettingsRequest'
      responses:
        '200':
          description: Updated room record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /rooms/{code}/start:
    post:
      tags: [rooms]
      operationId: startGame
      summary: Start the game (host only)
      parameters:
        - $ref: '#/components/parameters/RoomCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGameRequest'
      responses:
        '200':
          description: Started room record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /daily/{mode}/config:
    get:
      tags: [daily]
      operationId: getDailyConfig
      summary: Daily mode configuration (board count / attempt budget)
      parameters:
        - $ref: '#/components/parameters/DailyMode'
      responses:
        '200':
          description: Mode configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyModeConfig'
        '404':
          $ref: '#/components/responses/NotFound'
  /daily/{mode}/guess:
    post:
      tags: [daily]
      operationId: submitDailyGuess
      summary: Replay the full ordered guess history for a daily puzzle
      parameters:
        - $ref: '#/components/parameters/DailyMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyGuessRequest'
      responses:
        '200':
          description: Recomputed board feedback for every board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPuzzleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    RoomCode:
      name: code
      in: path
      required: true
      description: 8-character room code (first character identifies the owning instance)
      schema:
        type: string
        pattern: '^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{8}$'
    DailyMode:
      name: mode
      in: path
      required: true
      description: One of `termo`, `dueto`, `quarteto`
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request payload, code or settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid session secret
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The player is not allowed to perform this host action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Room or daily mode not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Room already started, full, or attempts exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RoomMode:
      type: string
      enum: [championship, race]
    RoomStatus:
      type: string
      enum: [lobby, in-progress, finished]
    RoomPlayer:
      type: object
      required: [playerId, nickname]
      properties:
        playerId:
          type: string
        nickname:
          type: string
    PublicRoomPlayer:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
    RoomSettings:
      type: object
      required: [wordCount, maxAttempts, timeLimitMs]
      properties:
        wordCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 15
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        timeLimitMs:
          type: integer
          format: int64
          minimum: 30000
          maximum: 600000
    RoomSettingsInput:
      type: object
      properties:
        wordCount:
          type: integer
          format: int32
        maxAttempts:
          type: integer
          format: int32
        timeLimitMs:
          type: integer
          format: int64
    RoomRecord:
      type: object
      required: [code, mode, hostId, createdAt, isPublic, settings, status, players]
      properties:
        code:
          type: string
        mode:
          $ref: '#/components/schemas/RoomMode'
        hostId:
          type: string
        createdAt:
          type: integer
          format: int64
        isPublic:
          type: boolean
        settings:
          $ref: '#/components/schemas/RoomSettings'
        status:
          $ref: '#/components/schemas/RoomStatus'
        players:
          type: array
          items:
            $ref: '#/components/schemas/RoomPlayer'
    PublicRoomSummary:
      type: object
      required: [code, mode, isPublic, settings, status, players]
      properties:
        code:
          type: string
        mode:
          $ref: '#/components/schemas/RoomMode'
        isPublic:
          type: boolean
        settings:
          $ref: '#/components/schemas/RoomSettings'
        status:
          $ref: '#/components/schemas/RoomStatus'
        players:
          type: array
          items:
            $ref: '#/components/schemas/PublicRoomPlayer'
    CreateRoomRequest:
      type: object
      required: [hostId, nickname, mode]
      properties:
        hostId:
          type: string
          minLength: 1
          maxLength: 64
        nickname:
          type: string
          minLength: 1
          maxLength: 24
        mode:
          $ref: '#/components/schemas/RoomMode'
        isPublic:
          type: boolean
          default: true
        settings:
          $ref: '#/components/schemas/RoomSettingsInput'
    UpdateRoomSettingsRequest:
      type: object
      required: [playerId, sessionSecret, settings]
      properties:
        playerId:
          type: string
          minLength: 1
          maxLength: 64
        sessionSecret:
          type: string
          minLength: 1
          maxLength: 64
        settings:
          $ref: '#/components/schemas/RoomSettingsInput'
    StartGameRequest:
      type: object
      required: [playerId, sessionSecret]
      properties:
        playerId:
          type: string
          minLength: 1
          maxLength: 64
        sessionSecret:
          type: string
          minLength: 1
          maxLength: 64
    DailyModeConfig:
      type: object
      required: [wordCount, maxAttempts]
      properties:
        wordCount:
          type: integer
          format: int32
        maxAttempts:
          type: integer
          format: int32
    DailyGuessRequest:
      type: object
      required: [guesses]
      properties:
        guesses:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: string
            minLength: 1
            maxLength: 5
    LetterStatus:
      type: string
      enum: [correct, present, absent]
    LetterFeedback:
      type: object
      required: [letter, status]
      properties:
        letter:
          type: string
        status:
          $ref: '#/components/schemas/LetterStatus'
    DailyBoardAttempt:
      type: object
      required: [guess, feedback, attemptNumber]
      properties:
        guess:
          type: string
        feedback:
          type: array
          items:
            $ref: '#/components/schemas/LetterFeedback'
        attemptNumber:
          type: integer
          format: int32
    DailyBoardResult:
      type: object
      required: [attempts, solved, revealedWord]
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/DailyBoardAttempt'
        solved:
          type: boolean
        revealedWord:
          type: string
          nullable: true
    DailyPuzzleResult:
      type: object
      required: [boards, attemptsUsed, maxAttempts, finished, won]
      properties:
        boards:
          type: array
          items:
            $ref: '#/components/schemas/DailyBoardResult'
        attemptsUsed:
          type: integer
          format: int32
        maxAttempts:
          type: integer
          format: int32
        finished:
          type: boolean
        won:
          type: boolean
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
          nullable: true
