# HTTP / REST
quarkus.http.port=${PORT:4000}
quarkus.http.host=0.0.0.0

# CORS for the browser frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS
quarkus.http.cors.headers=content-type

# Redis (shared room + session state)
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

# Instance identity (first char of every room code this replica mints)
app.instance-tag=${INSTANCE_TAG:A}

# Security headers (headline subset of the previous @fastify/helmet defaults)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=SAMEORIGIN
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Permitted-Cross-Domain-Policies".value=none

# WebSockets Next
quarkus.websockets-next.server.auto-ping-interval=30

# API-first: serve the authored OpenAPI document as-is (do not re-derive it from annotations).
# The document lives at src/main/resources/META-INF/openapi.yaml and is also the codegen input.
mp.openapi.scan.disable=true

# Serve the interactive docs in every profile (the API surface is public; disable if undesired).
quarkus.swagger-ui.always-include=true
